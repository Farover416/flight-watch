# ---------------------------------------------------------------------------
# Year-end trip watcher: Singapore -> China / Korea / Japan, Dec 2026
# Everything you might want to tweak lives in this file.
# ---------------------------------------------------------------------------

origin: SIN
currency: SGD
# Search as Singapore. Google otherwise decides from the address of the
# machine asking, and the scheduled runs come from a GitHub server in the US:
# on the same Qingdao search at the same hour, a browser here was shown S$597
# and S$606 fares that the runner never saw. Set this to where you would book.
market: SG
adults: 1
seat: economy

# The price compared against your budget includes the estimated bag fees, so a
# fare that "looks" cheap but charges for baggage is scored honestly. One
# checked bag is assumed - winter clothes do not fit in a cabin bag - plus the
# cabin bag itself, which most carriers include free anyway.
carry_on_bags: 1
# Google Flights accepts a checked-bag parameter but IGNORES it - verified in a
# browser on 13 Sep 2026: the encoded URL carries the flag, yet the filter chip
# never appears and the price does not move. So checked_bags stays 0 and the fee
# is added below instead.
checked_bags: 0

# Estimated checked-bag fee in SGD, per one-way leg, for carriers that charge.
# Anything not listed is assumed to include a bag in the fare - true of the
# full-service Chinese carriers, Cathay, Thai Lion and Batik. Matching is on the
# airline name, case-insensitive substring. Where an itinerary mixes carriers
# the largest fee is used. These are estimates: confirm at checkout.
checked_bag_fees:
  scoot: 50
  vietjet: 40
  airasia: 45
  spring airlines: 40
  jeju air: 45
  t'way: 45
  peach: 45
  zipair: 55
  cebu pacific: 45
  peach aviation: 45
max_stops: 1
exclude_basic_economy: false

# --- budget -----------------------------------------------------------------
# Alert when a full return trip costs this or less.
max_total: 900
# Re-alert a deal you've already been told about only once it drops this much.
realert_drop: 20
# Also ping when the cheapest combination ever seen improves by this much,
# even if it is still above max_total (so you can watch the trend).
new_best_drop: 40

# --- dates ------------------------------------------------------------------
# Outbound. "night" on the 18th is enforced as a departure at or after 21:00.
outbound:
  - date: "2026-12-18"
    earliest_departure_hour: 21   # "night" = 9pm onwards, to get there from work
  - date: "2026-12-19"
    earliest_departure_hour: 0

# Return flights may leave on any of these days...
return_dates: ["2026-12-27", "2026-12-28", "2026-12-29"]
# ...but you must be on the ground at Changi by this local time. Red-eyes that
# land on the morning of the 30th are rejected automatically.
arrive_home_by: "2026-12-30 01:00"

# Minimum nights away, so a combination that flies you home too early is
# filtered out before it reaches your phone.
min_nights: 7

# --- other trips ------------------------------------------------------------
# Everything above describes the December trip, which runs by default and is
# untouched by anything here. A trip listed below is the same watcher with a
# few settings changed and its own folder under data/ to keep its prices in -
# so its history, its alerts and its chart are its own, while every search,
# price and link is built by exactly the same code.
#
# Run one with: python -m flightwatch --trip taipei
trips:
  taipei:
    name: Singapore ⇄ Taipei
    data_subdir: taipei        # prices land in data/taipei/
    # No fixed days: anything inside the school holiday will do, as long as
    # the stay is long enough to be worth the flight.
    window:
      from: "2026-11-21"       # Term 4 ends Fri 20 Nov
      to: "2026-12-31"
      min_nights: 14
      max_nights: 30
      # 323 date pairs is far too many to price every run, so the grid is
      # walked coarsely first and then in detail around whatever looked
      # cheapest. Raise scan_step or trim scan_durations to make a run
      # lighter; drop scan_step to 1 to price every pair.
      scan_step: 3
      scan_durations: [14, 18, 22, 26, 30]
      zoom_radius: 2
    settings:
      adults: 2                # one of them is 14, which books as an adult
      max_total: null          # no budget to hit - report the cheapest and
                               # say when it is a new low
      # Direct only. SIN-TPE is under five hours nonstop on Scoot, SQ, EVA
      # and China Airlines; the one-stop routings that undercut them do it
      # by spending most of a day in Ho Chi Minh City. Nonstop also means
      # the layover rules above never come into play here - there is no
      # connection to judge - so this trip is not filtered by them at all.
      max_stops: 0
      # No checked bag on this one, so no fee to add. Leaving the table in
      # place would quietly inflate every fare by the estimate for a bag
      # nobody is buying.
      checked_bag_fees: {}
      # A window has too many date pairs to open every one, so this trip
      # opens the twelve its search ranks cheapest instead of six.
      survey: false
      verify_top: 12
      # A window search never uses the return-by deadline, but a date this
      # far out keeps it from quietly filtering anything if it ever does.
      arrive_home_by: "2027-01-02 23:59"
      destinations:
        Taiwan:
          priority: [TPE]
          extended: []

# --- where ------------------------------------------------------------------
# City codes cover every airport in that city (TYO = Narita + Haneda,
# SEL = Incheon + Gimpo, SHA = Pudong + Hongqiao, BJS = Capital + Daxing,
# CTU = Shuangliu + Tianfu).
#
# priority = searched on every single run.
# extended = the long tail, searched a slice at a time on a rotation, so a
#            hundred-odd cities stay affordable. Every extended city comes up
#            roughly once a day. Move any city between the two lists freely.
destinations:
  Japan:
    priority: [TYO, OSA, FUK, CTS, NGO, OKA]
    extended: [HIJ, SDJ, KOJ, TAK, OKJ, KMJ, HKD]
  Korea:
    priority: [SEL, PUS]
    extended: [CJU, TAE, KWJ, CJJ]
  China:
    priority: [SHA, BJS, CAN, SZX, HGH, CTU, CKG, XMN, NKG, XIY, KMG, FOC]
    extended:
      # Yangtze delta + eastern seaboard
      [TAO, TSN, NGB, WNZ, WUX, CZX, TNA, HFE, YNT, WEH, YTY,
       # south coast
       JJN, ZUH, SWA, ZHA, NNG, BHY, LZH, KWL, KWE,
       # Hainan
       HAK, SYX,
       # central
       WUH, CSX, CGO, KHN, YIH, XFN, LYA, DYG,
       # north + northeast
       SHE, DLC, HRB, CGQ, TYN, SJW, HET, YNJ,
       # northwest
       LHW, INC, XNN,
       # Yunnan, for a province-wide check (all rail-linked to Kunming)
       LJG, DLU, JHG]

# --- open-jaw rules ---------------------------------------------------------
# You can fly home from a different city than you landed in, but only somewhere
# you could reasonably reach by train from where you landed. Each group below
# is a set of cities within a few hours of each other by rail; a pairing is
# allowed when both cities share at least one group. Groups deliberately
# overlap (Xi'an sits in both the Sichuan and the northwest group), which lets
# sensible chains through without listing every pair.
#
# A city in NO group can only be flown round-trip. Jeju counts as connected
# to the mainland - ferry, plus Seoul-Jeju is the cheapest hop in Asia - but
# there is nothing comparable off Okinawa.
rail_groups:
  # --- China ---
  yangtze_delta:     [SHA, HGH, NKG, NGB, WUX, CZX, HFE, WNZ, YTY]
  # Qingdao-Yantai-Weihai is one intercity line (the Qingrong), and Beijing
  # runs through G-trains to all three, so any of them can be the way in or out.
  # Shenyang sits in both this group and the northeast one: Beijing-Shenyang is
  # 2h30 on the Beijing-Harbin high-speed line, close enough to fly into and
  # train in. Dalian and Harbin stay northeast-only - 4-5h is further than
  # "nearby", and leaving them out keeps Beijing-Dalian from pairing up.
  north_china:       [BJS, TSN, SJW, TNA, TAO, YNT, WEH, TYN, CGO, SHE]
  pearl_delta:       [CAN, SZX, ZUH, SWA, ZHA, CSX, WUH]
  southeast_coast:   [XMN, FOC, JJN, SWA, WNZ, CAN, SZX]
  central_china:     [WUH, CSX, CGO, KHN, YIH, XFN, LYA, DYG]
  sichuan_chongqing: [CTU, CKG, XIY]
  northwest:         [XIY, LHW, INC, XNN, TYN, HET]
  southwest:         [KMG, KWE, NNG, KWL, LZH, BHY]
  # Kunming-Dali 2h, Kunming-Lijiang 3h, Kunming-Xishuangbanna 3.5h
  yunnan:            [KMG, LJG, DLU, JHG]
  northeast:         [SHE, DLC, CGQ, HRB, YNJ]
  hainan:            [HAK, SYX]
  # --- Japan (Shinkansen; Hokkaido is 8h from Tokyo so it stands alone) ---
  honshu_kyushu:     [TYO, NGO, OSA, OKJ, HIJ, FUK, KMJ, KOJ, TAK, SDJ]
  hokkaido:          [CTS, HKD]
  # --- Korea (KTX, plus the Jeju ferry / domestic hop) ---
  korea:             [SEL, PUS, TAE, KWJ, CJJ, CJU]

# --- areas ------------------------------------------------------------------
# Named groups for a one-shot check of a whole region: --only Yunnan searches
# every airport listed here and lets them open-jaw against each other, so you
# get one list for the area rather than one per airport. Chengdu and Chongqing
# are an hour apart by train, so either name searches both - fly into whichever
# is cheaper and home from the other.
areas:
  Yunnan:    [KMG, LJG, DLU, JHG]
  Beijing:   [BJS]
  Chengdu:   [CTU, CKG]
  Chongqing: [CTU, CKG]
  Sichuan:   [CTU, CKG]

# --- engine -----------------------------------------------------------------
# How many extended cities to fold into each run, on a rotating cursor.
extended_per_run: 12

# Also run a true round-trip search for the most promising cities. One-way legs
# price low-cost carriers correctly; full-service airlines often price a return
# far below two one-ways, and this catches those. Only the cheapest few cities
# from the one-way sweep are re-checked, so it costs a handful of searches
# rather than one per city.
check_round_trip: true
round_trip_candidates: 6

# Keep this many cheapest itineraries per individual search.
keep_per_search: 5
# How many deals to show in one message.
report_top: 12
# At most this many options for the same pair of cities (the one you land in,
# the one you fly home from). Stops one cheap route filling the whole message.
max_per_city_pair: 3
# Every run also sends a second, shorter message: the cheapest trips with the
# layover rules switched off entirely. Same dates, same one-stop cap, same
# checked bag - just no opinion about the connections. It costs no extra
# searches, and it shows what insisting on good transits is costing you.
unrestricted_top: 5

# What a plain fetch of a results page can see is the airline's own fare, on a
# short list. The cheaper agency prices - and the rest of the flights - arrive
# in a request the page makes after loading. So the few trips worth acting on
# get re-opened in a real browser, switched to Google's own Cheapest view, and
# read as a person would read them. Six page loads a sweep, not two hundred.
# Set verify_top to 0 to switch it off.
verify_top: 6
verify_rows: 4
# ...except that six is not enough. The feed only knows the airlines' own
# fares, so the six it ranks cheapest need not be where the agency fares are:
# on Qingdao 19-28 Dec the feed put the 8:20 PM Cathay flight at S$976 and
# the page sold it for S$497, a search the six never included. So for this
# trip every search is opened - each city as a return trip, each open jaw
# both ways as one ticket and as two - and each one-ticket search's return
# screens are read for a return you would actually take. About 34 pages and
# forty minutes a run for two cities. The trips below (a date window, far
# too many pairs to open) keep verify_top. See flightwatch/survey.py.
survey: true

# --- layovers ----------------------------------------------------------------
# A connection is worth having only if it is either quick, or long enough in
# daylight that you can leave the airport and see the city. The awkward middle -
# six hours overnight in a terminal, or a 28-hour "one stop" - is thrown away.
#
# A stop qualifies if EITHER
#   min_minutes <= length <= short_max_minutes                (just wait airside)
#   OR
#   explore_min_minutes <= length <= explore_max_minutes, AND at least
#   min_daylight_minutes of it falls between day_from_hour and day_to_hour, AND
#   no more than max_dead_minutes falls outside those hours   (go into the city)
#
# The stop does not have to sit inside day hours at all - landing at 05:00 and
# waiting for the city to open is fine, and so is an overnight stop that turns
# into a full day out. What decides it is how many usable hours you actually
# get. max_dead_minutes only rules out the absurd; explore_max_minutes is what
# stops a "one stop" being a day and a half. Times are local to the connecting
# airport; direct flights always qualify.
layover:
  min_minutes: 75
  short_max_minutes: 240
  explore_min_minutes: 420
  # 24h ceiling. It was 18, which was the one rule standing between you and a
  # S$607 Qingdao round trip: 21h 05 at Beijing, ~12h 40 of it in daylight and
  # only ~8h 30 dead overnight, so it cleared every other test here and was
  # thrown out for being three hours too long. A stop you can leave the airport
  # for is the thing these rules are meant to allow; the two below are what
  # keep it from becoming a night in a terminal.
  explore_max_minutes: 1440
  day_from_hour: 8           # when somewhere to eat is actually open
  day_to_hour: 21
  min_daylight_minutes: 300  # at least 5 hours genuinely out there
  max_dead_minutes: 780      # one night waiting is fine, two is not

